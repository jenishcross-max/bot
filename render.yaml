services:
  # WhatsApp-бот и Telegram-админка живут в одном сервисе (server.js): на free-тарифе
  # Render часы инстансов общие, двух круглосуточных сервисов не хватит.
  - type: web
    name: salon-bots
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # --- Groq ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_AUDIO_MODEL
        value: whisper-large-v3

      # --- WhatsApp ---
      # Base64 локальной папки auth_info: node scripts/pack-auth.js
      - key: AUTH_INFO_B64
        sync: false
      # Пароль к /qr — странице с QR-кодом. Render сгенерирует случайное значение,
      # посмотреть его можно во вкладке Environment у сервиса.
      - key: QR_TOKEN
        generateValue: true

      # --- База (услуги и записи) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # --- Telegram-админка ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false

      # --- Салон ---
      # Отдельного переключателя режима больше нет: бот всегда работает как салон.
      # Требует таблиц из supabase_schema.sql, а на уже заведённой базе —
      # supabase_salon_step1.sql, step2 (мастера) и step3 (напоминания).
      - key: SALON_NAME
        sync: false
      - key: SALON_ADDRESS
        sync: false
      - key: SALON_PHONE
        sync: false
      - key: SALON_HOURS
        sync: false
      - key: SALON_TZ
        value: Asia/Bishkek
      # Мастера через запятую (Айгуль,Динара) — для первого запуска. Дальше
      # состав салона живёт в базе и правится из Телеграма, эта переменная
      # остаётся запасным составом. Пусто — салон считается «в одно кресло».
      - key: SALON_MASTERS
        sync: false
      # Длительность услуги по умолчанию и шаг сетки окошек — разные вещи:
      # стрижка на 40 минут не должна занимать час.
      - key: SALON_SLOT_MINUTES
        value: "60"
      - key: SALON_SLOT_STEP
        value: "30"
      - key: SALON_LEAD_MINUTES
        value: "30"

      # --- Напоминания клиентам ---
      # Час накануне, в который бот пишет клиенту (по времени салона), и за
      # сколько минут напоминать, если запись сделали позже этого часа.
      # Требуют supabase_salon_step3.sql. Уснувший сервис ничего не шлёт:
      # заведите внешний будильник на <адрес сервиса>/cron раз в 5–10 минут.
      - key: SALON_REMINDER_HOUR
        value: "19"
      - key: SALON_REMINDER_LEAD_MINUTES
        value: "120"

      - key: CURRENCY
        value: сом
      # Необязательные: если не заданы, бот соберёт тексты сам из данных выше.
      - key: SALON_SYSTEM_PROMPT
        sync: false
      - key: MANAGER_CONTACT_TEXT
        sync: false
