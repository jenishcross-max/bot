<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Промо-ролик — WhatsApp-бот для бизнеса</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Фон страницы = цвет краёв сцены: если окно не ровно 9:16, поля по бокам
     не видно на записи. */
  html, body { height: 100%; background: #070b12; overflow: hidden; }

  /* Сцена всегда 1080x1920 (вертикаль для Reels/Stories), а на экран её
     ужимает transform: scale — так вёрстка не зависит от размера окна. */
  #fit { position: fixed; inset: 0; overflow: hidden; }
  #stage {
    width: 1080px; height: 1920px; position: absolute; left: 50%; top: 50%; overflow: hidden;
    transform-origin: center center;
    background: radial-gradient(120% 75% at 50% 0%, #17304a 0%, #0c1626 55%, #070b12 100%);
    color: #eef4fb;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 50% 45%, rgba(37,211,102,.16), transparent 70%);
  }

  /* --- Плашка ниши сверху --- */
  .tag {
    position: absolute; top: 92px; left: 50%; transform: translateX(-50%);
    padding: 18px 40px; border-radius: 999px; z-index: 5;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16);
    font-size: 34px; font-weight: 600; letter-spacing: .5px; white-space: nowrap;
    opacity: 0; transition: opacity .3s ease;
  }
  .tag.show { opacity: 1; }

  /* --- Телефон --- */
  .phone {
    position: absolute; top: 210px; left: 50%; transform: translateX(-50%);
    width: 730px; height: 1330px; z-index: 4;
    border-radius: 62px; border: 12px solid #1b2733; overflow: hidden;
    background: #efeae2;
    box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.06);
    opacity: 0; transition: opacity .35s ease;
  }
  .phone.show { opacity: 1; }
  .phone.tg { background: #cfd9e4; }

  .head {
    height: 132px; display: flex; align-items: center; gap: 22px; padding: 0 28px;
    background: #008069; color: #fff; transition: background .3s ease;
  }
  .phone.tg .head { background: #517da2; }
  .phone.tg .chat { background: #cfd9e4; }
  .head .ava {
    width: 82px; height: 82px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 42px;
  }
  .head .who { font-size: 36px; font-weight: 600; line-height: 1.2; }
  .head .st { font-size: 25px; opacity: .85; margin-top: 4px; }

  /* justify-content: flex-end — переписка растёт снизу вверх, как в настоящем чате,
     а не висит вверху пустого экрана. */
  .chat {
    height: calc(100% - 132px); overflow: hidden; padding: 26px 26px 34px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 18px;
    background: #e4ddd4;
  }
  .row { display: flex; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }
  .bubble {
    max-width: 80%; padding: 22px 26px; border-radius: 28px; font-size: 33px; line-height: 1.36;
    color: #10231c; background: #fff; white-space: pre-line;
    box-shadow: 0 3px 8px rgba(0,0,0,.10);
    animation: pop .3s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .row.in .bubble { border-top-left-radius: 10px; }
  .row.out .bubble { background: #d9fdd3; border-top-right-radius: 10px; }
  .phone.tg .row.out .bubble { background: #eeffdd; }
  .bubble .time { display: block; margin-top: 10px; font-size: 22px; color: #667781; text-align: right; }
  /* Фото товара от клиента — «снимок» в пузыре, как в настоящей переписке. */
  .bubble.has-photo { width: 60%; max-width: 60%; }
  .bubble .photo {
    height: 330px; margin-bottom: 16px; border-radius: 18px;
    background: linear-gradient(155deg, #f6f7f9 0%, #dde3ea 100%);
    display: grid; place-items: center; font-size: 175px; line-height: 1;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }

  .bubble.typing { display: flex; gap: 12px; padding: 30px 30px; }
  .bubble.typing i {
    width: 15px; height: 15px; border-radius: 50%; background: #90a4a0;
    animation: blink 1.1s infinite ease-in-out;
  }
  .bubble.typing i:nth-child(2) { animation-delay: .18s; }
  .bubble.typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-6px); } }

  /* --- Уведомление в Telegram владельцу --- */
  .card {
    position: absolute; top: 250px; left: 100px; right: 100px; z-index: 8;
    background: #fff; color: #14202b; border-radius: 30px; padding: 26px 30px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    animation: cardIn .4s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .card.hide { animation: cardOut .3s ease both; }
  .card .src { display: flex; align-items: center; gap: 12px; font-size: 26px; color: #517da2; font-weight: 700; margin-bottom: 12px; }
  .card .txt { font-size: 32px; line-height: 1.35; white-space: pre-line; font-weight: 500; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-40px) scale(.95); } to { opacity: 1; transform: none; } }
  @keyframes cardOut { to { opacity: 0; transform: translateY(-30px) scale(.97); } }

  /* --- Подпись снизу --- */
  .cap {
    position: absolute; bottom: 120px; left: 90px; right: 90px; z-index: 5; text-align: center;
    font-size: 46px; font-weight: 700; line-height: 1.24; letter-spacing: -.5px;
    text-shadow: 0 6px 30px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(16px); transition: opacity .3s ease, transform .3s ease;
  }
  .cap.show { opacity: 1; transform: none; }
  .cap b { color: #6ef29a; }

  /* --- Заставка и финал --- */
  .overlay {
    position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
    padding: 0 90px; opacity: 0; pointer-events: none; transition: opacity .4s ease;
    background: radial-gradient(90% 60% at 50% 40%, #163b2c 0%, #0b1220 60%, #070b12 100%);
  }
  .overlay.show { opacity: 1; }
  .overlay .wa-mark { font-size: 130px; margin-bottom: 30px; }
  .overlay h1 { font-size: 96px; line-height: 1.08; font-weight: 800; letter-spacing: -2px; }
  .overlay h1 span { color: #25d366; }
  .overlay .sub { margin-top: 34px; font-size: 46px; font-weight: 600; opacity: .85; line-height: 1.3; }
  .overlay .niches { margin-top: 46px; font-size: 38px; line-height: 1.7; opacity: .8; font-weight: 500; }
  .overlay .pill {
    margin-top: 50px; display: inline-block; padding: 22px 46px; border-radius: 999px;
    background: #25d366; color: #06281a; font-size: 42px; font-weight: 800; line-height: 1.25;
    max-width: 820px;
    animation: pop .45s cubic-bezier(.2,.9,.3,1.4) both;
  }
  .fadein > * { animation: up .55s cubic-bezier(.2,.9,.3,1) both; }
  .fadein > *:nth-child(2) { animation-delay: .14s; }
  .fadein > *:nth-child(3) { animation-delay: .26s; }
  .fadein > *:nth-child(4) { animation-delay: .38s; }
  @keyframes up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

  /* --- Заставка «включить звук» ---
     Браузер не запускает аудио без клика пользователя, поэтому ролик стартует
     не сам, а с этой кнопки. */
  #gate {
    position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
    background: rgba(4,8,14,.95); color: #eef4fb; text-align: center; padding: 24px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5;
  }
  #gate.gone { display: none; }
  #gate .ico { font-size: 62px; }
  #gate h2 { font-size: 26px; margin: 14px 0 10px; }
  #gate p { opacity: .7; margin-bottom: 22px; }
  #gate button {
    font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px 26px;
    border-radius: 12px; border: 0; cursor: pointer; margin: 0 6px;
    background: #25d366; color: #06281a;
  }
  #gate button.ghost { background: rgba(255,255,255,.12); color: #cdd8e6; font-weight: 500; }
  #gate .warn { margin: 22px auto 0; font-size: 13px; color: #9fb0c4; max-width: 560px; line-height: 1.6; }
  #gate .warn b { color: #ffcf6b; font-weight: 600; }

  /* --- Панель управления (в запись не попадает: прячется клавишей H или ?clean=1) --- */
  #ui {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px);
    background: rgba(12,18,28,.9); border: 1px solid rgba(255,255,255,.14); border-radius: 14px;
    padding: 10px 14px; color: #cdd8e6; font: 500 14px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #ui.hidden { display: none; }
  #ui button {
    font: inherit; padding: 8px 14px; border-radius: 9px; cursor: pointer;
    background: #25d366; color: #06281a; border: 0; font-weight: 700;
  }
  #ui button.ghost { background: rgba(255,255,255,.1); color: #cdd8e6; }
  #ui button.off { opacity: .4; text-decoration: line-through; }
  #ui .dur { opacity: .75; }

  /* Индикатор записи: виден только записывающему, в файл не попадает —
     кадры берутся из области сцены, а он снаружи. */
  #rec {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 150;
    display: none; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px;
    background: rgba(200,30,40,.9); color: #fff;
    font: 700 14px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #rec.on { display: flex; }
  #rec i { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
</style>
</head>
<body>
  <div id="fit">
    <div id="stage">
      <div id="tag" class="tag"></div>
      <div id="phone" class="phone">
        <div id="head" class="head"></div>
        <div id="chat" class="chat"></div>
      </div>
      <div id="cap" class="cap"></div>
      <div id="cards"></div>
      <div id="overlay" class="overlay"></div>
    </div>
  </div>

  <div id="rec"><i></i><span id="recTxt">Идёт запись</span></div>

  <div id="gate">
    <div>
      <div class="ico">🔊</div>
      <h2>Промо-ролик с озвучкой</h2>
      <p>Ролик зациклен — записывать удобно со второго круга.</p>
      <button id="goSound">▶ Смотреть со звуком</button>
      <button id="goMute" class="ghost">Без звука</button>
      <div class="warn" id="gateWarn"></div>
    </div>

  <div id="ui">
    <button id="replay">↻ Сначала</button>
    <button id="save">⬇ Сохранить видео</button>
    <button id="mus" class="ghost">🔊 Звук (M)</button>
    <button id="hide" class="ghost">Скрыть (H)</button>
    <span class="dur" id="dur"></span>
  </div>

<script>
/* ------------------------------------------------------------------
   Промо-ролик 1080x1920 (Reels / Stories / TikTok).

   Главный хронометр здесь — озвучка voice.mp3, а не таймеры сцен.
   Тайминги ниже сняты с самого файла: начало каждой сцены стоит в паузе
   перед соответствующей фразой, поэтому картинка меняется до первого слова,
   а не после него. Если перезапишете озвучку — поменяйте только поля at.
------------------------------------------------------------------- */
const CONFIG = {
  finalCta: 'Напишите «ИИ» в комментарии',   // призыв в самом конце
  music: false,                       // фоновая музыка; звуки переписки играют в любом случае
  cta: 'Подключу вашему бизнесу за 1 день',
  voice: 'voice.mp3',
  end: 38.4,                          // голос кончается на 36.3 — финал ещё держим
};

/* Расшифровка озвучки (для сверки таймингов):
   0.04–2.56  Привет всем! У меня для вас потрясающая новость.
   3.00–6.82  Представьте, ваш WhatsApp сам отвечает клиентам, даже когда вы спите.
   7.22–14.56 Клиент спрашивает о товаре, а ИИ-ассистент мгновенно находит цену,
              проверяет наличие и даже оформляет заказ.
   14.98–19.22 А если прислали фото, он сам узнаёт модель, размеры и забронирует товар.
   19.60–21.04 Вам придёт только уведомление.
   21.38–24.54 Он знает всё — наличие, комплектации, сроки заказа.
   24.96–28.34 А слишком сложный — ИИ-ассистент честно передаст его вам.
   28.78–32.24 Вы можете загружать товары одним сообщением прямо из Телеграма.
   32.62–35.30 Я подключу это вашему бизнесу всего за один день.
   35.64–36.28 Напишите мне. */

const SCENES = [
  {
    at: 0, type: 'intro',
    mark: '📣',
    h1: 'Новость для<br><span>вашего бизнеса</span>',
  },
  {
    at: 2.80, type: 'intro',
    mark: '💬',
    h1: 'Ваш WhatsApp<br><span>отвечает сам</span>',
    sub: 'Клиент пишет в 2 ночи — ответ через 2 секунды',
  },
  {
    at: 7.00, type: 'chat', app: 'wa',
    tag: '🔩 Строймаркет',
    ava: '🧑', who: 'Клиент', st: '+996 555 ***  ·  02:14',
    cap: 'Цена и остаток — <b>из вашей базы</b>, бот ничего не выдумывает',
    msgs: [
      { s: 'in',  t: 'монтажная пена есть? почём' },
      { s: 'out', t: 'Есть 🙂 Makroflex 750 мл — 420 сом, на складе 14 баллонов.\nПистолет для пены — 850 сом. Отложить?', typing: 1500 },
      { s: 'in',  t: 'давай 3 баллона' },
      { s: 'out', t: 'Отложил 3 баллона, итого 1260 сом.\nЗаберёте сегодня до 19:00?', typing: 1300 },
    ],
  },
  {
    at: 14.78, type: 'chat', app: 'wa',
    tag: '👕 Магазин одежды',
    ava: '👩', who: 'Клиент', st: '+996 700 ***  ·  в сети',
    cap: 'Прислали фото — бот <b>узнал модель и назвал размеры</b>',
    // Уведомление владельцу закреплено по времени: фраза «Вам придёт только
    // уведомление» начинается на 19.60, карточка должна выехать чуть раньше.
    card: { at: 19.35, dur: 1.75, t: '🔔 Новая бронь\nФутболка оверсайз, L · 990 сом\nКлиент: +996 700 ***' },
    msgs: [
      { s: 'in',  img: '👕', t: 'есть такая футболка? размер L' },
      { s: 'out', t: 'Да! Оверсайз, белая — 990 сом.\nL и XL в наличии, есть ещё чёрная.\nОтложить L?', typing: 1700 },
      { s: 'in',  t: 'да, отложите' },
    ],
  },
  {
    at: 21.20, type: 'chat', app: 'wa',
    tag: '📱 Электроника',
    ava: '🧔', who: 'Клиент', st: '+996 777 ***  ·  в сети',
    cap: 'Знает <b>наличие, комплектации и сроки заказа</b>',
    msgs: [
      { s: 'in',  t: 'айфон 17 про макс есть?' },
      { s: 'out', t: 'iPhone 17 Pro Max 256 ГБ — 129 900 сом, чёрный и титан.\n512 ГБ — под заказ, 3 дня.', typing: 1500 },
    ],
  },
  {
    at: 24.75, type: 'chat', app: 'wa',
    tag: '🙋 Хочет живого человека',
    ava: '🧑', who: 'Клиент', st: '+996 555 ***  ·  в сети',
    cap: 'Сложный вопрос — бот <b>честно передаёт заявку вам</b>',
    card: { at: 27.25, dur: 1.35, t: '🔔 Клиент просит менеджера\n+996 555 *** · «можно с менеджером?»' },
    msgs: [
      { s: 'in',  t: 'можно с менеджером поговорить?' },
      { s: 'out', t: 'Конечно! Передал заявку менеджеру — он свяжется в течение 10 минут.', typing: 1100 },
    ],
  },
  {
    at: 28.56, type: 'chat', app: 'tg',
    tag: '⚙️ Вы — из Telegram',
    ava: '🤖', who: 'Бот-админка', st: 'управление товарами',
    cap: 'Весь прайс — <b>одним сообщением</b>',
    msgs: [
      { s: 'out', t: 'Пена Makroflex 750; 420; 14\nПерчатки рабочие; 90; 100' },
      { s: 'in',  t: 'Готово:\n🆕 Пена Makroflex 750 — 420 сом, 14 шт.\n🆕 Перчатки рабочие — 90 сом, 100 шт.', typing: 1200 },
    ],
  },
  {
    at: 32.42, type: 'cta',
    mark: '🟢',
    h1: CONFIG.cta,
    sub: 'Работает на вашем номере WhatsApp.\nБез приложений и сайтов.',
    niches: 'строймаркеты · одежда · электроника<br>салоны красоты · автосервисы · доставка',
    pill: CONFIG.finalCta,
    pillAt: 35.45,                    // ровно под фразу «Напишите мне»
  },
];

/* ---------------- звук ----------------
   Голос — ваш файл voice.mp3. Звуки переписки синтезируются прямо в браузере
   (Web Audio API): в проекте нет ни одного звукового файла, кроме озвучки,
   поэтому и вопроса с правами в рекламе не возникает.

   Фоновая музыка тоже синтезируется, но по умолчанию выключена (CONFIG.music):
   под живой голос она лезла вперёд и звучала чужеродно.
------------------------------------------------------------------- */
const AUDIO = (() => {
  const BPM = 84;
  const STEP = 60 / BPM / 2;                     // длительность восьмой, сек
  // Am - F - C - G: спокойная светлая последовательность, не спорит с голосом.
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
  const hz = (n) => 440 * Math.pow(2, (n - 69) / 12);

  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
  let sched = null, step = 0, nextT = 0;
  let soundOn = true;

  // Под голосом музыка сидит тихо, в финале — выходит вперёд.
  const BED = 0.30, FULL = 0.85;

  function tone(type, f, t, dur, peak, bus, glideTo) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur * 0.7);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noiseSrc() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.2), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    return s;
  }

  function hat(t, peak) {
    const s = noiseSrc();
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 8500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + 0.07);
  }

  function kick(t) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(115, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.75, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.28);
  }

  // Пад держится весь такт: три расстроенных пилы через мягкий фильтр.
  function pad(chord, t, dur) {
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 850; f.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.7);
    g.gain.setValueAtTime(0.13, t + dur - 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(musicBus);
    for (let i = 0; i < chord.length; i++) {
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = hz(chord[i]);
      o.detune.value = (i - 1) * 7;
      o.connect(f);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  // Планировщик с большим запасом (1.5 с): если вкладка уходит в фон и таймеры
  // тормозятся до 1 с, музыка всё равно не рвётся.
  function tick() {
    const ahead = ctx.currentTime + 1.5;
    while (nextT < ahead) {
      const s = step % 8;
      const chord = CHORDS[Math.floor(step / 8) % CHORDS.length];
      if (s === 0) pad(chord, nextT, STEP * 8);
      if (s === 0 || s === 4) { kick(nextT); tone('sine', hz(chord[0] - 24), nextT, 0.45, 0.30); }
      hat(nextT, s % 2 ? 0.045 : 0.08);
      tone('triangle', hz(chord[ARP[s]] + 12), nextT, 0.30, 0.085);
      nextT += STEP; step++;
    }
  }

  function startMusic() {
    if (sched) return;
    step = 0;
    nextT = ctx.currentTime + 0.15;
    tick();
    sched = setInterval(tick, 250);
  }

  function stopMusic() {
    clearInterval(sched); sched = null;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
  }

  return {
    isSoundOn: () => soundOn,

    init(sound) {
      soundOn = !!sound;
      if (!sound || ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { soundOn = false; return; }
      ctx = new AC();
      musicBus = ctx.createGain(); musicBus.gain.value = BED;
      // Без музыки щелчкам не с чем спорить, поэтому их можно не задирать.
      sfxBus = ctx.createGain(); sfxBus.gain.value = CONFIG.music ? 1 : 0.8;
      master = ctx.createGain(); master.gain.value = 0.45;
      musicBus.connect(master); sfxBus.connect(master); master.connect(ctx.destination);
      if (CONFIG.music) startMusic();
    },

    // Финальный подъём музыки, когда голос уже отговорил.
    swell(on) {
      if (!ctx || !soundOn || !CONFIG.music) return;
      musicBus.gain.setTargetAtTime(on ? FULL : BED, ctx.currentTime, on ? 0.5 : 0.2);
    },

    // Кнопка глушит всё синтезированное разом — и музыку, и звуки переписки.
    toggleSound() {
      soundOn = !soundOn;
      if (!ctx) return soundOn;
      master.gain.setTargetAtTime(soundOn ? 0.45 : 0.0001, ctx.currentTime, 0.1);
      if (!CONFIG.music) return soundOn;
      if (soundOn) { musicBus.gain.setValueAtTime(BED, ctx.currentTime); startMusic(); }
      else stopMusic();
      return soundOn;
    },

    // Короткие звуки переписки: входящее — две ноты вверх, исходящее — мягкий «пуф».
    sfx(kind) {
      if (!ctx || !soundOn) return;
      const t = ctx.currentTime;
      if (kind === 'in') { tone('sine', 700, t, 0.13, 0.5, sfxBus); tone('sine', 1050, t + 0.09, 0.2, 0.42, sfxBus); }
      if (kind === 'out') { tone('sine', 520, t, 0.1, 0.34, sfxBus); tone('sine', 700, t + 0.06, 0.16, 0.26, sfxBus); }
      if (kind === 'card') {
        [1046, 1568, 2093].forEach((f, i) => tone('sine', f, t + i * 0.02, 0.9 - i * 0.2, 0.34 - i * 0.09, sfxBus));
      }
      if (kind === 'scene') {                 // короткий «вжух» на смене сцены
        const s = noiseSrc();
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass'; f.Q.value = 1.1;
        f.frequency.setValueAtTime(400, t);
        f.frequency.exponentialRampToValueAtTime(3200, t + 0.34);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.12);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        s.connect(f); f.connect(g); g.connect(sfxBus);
        s.start(t); s.stop(t + 0.42);
      }
    },
  };
})();

/* ---------------- сцена ---------------- */
const stage = document.getElementById('stage');
const phone = document.getElementById('phone');
const head  = document.getElementById('head');
const chat  = document.getElementById('chat');
const tagEl = document.getElementById('tag');
const capEl = document.getElementById('cap');
const cards = document.getElementById('cards');
const over  = document.getElementById('overlay');

function fit() {
  // Центрируем через translate, а не grid: grid прижимает элемент к краю,
  // когда он больше контейнера, и сцена уезжает за экран.
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();

function el(cls, html) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
// «990 сом», «14 шт.», «256 ГБ» — число и единицу переносом строки не разрываем.
const NB = ' ';
const esc = (s) => s
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/(\d) (?=сом|шт|ГБ|мл|баллон|мин)/g, '$1' + NB);

function clock() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function addMsg(m) {
  const row = el('row ' + (m.s === 'in' ? 'in' : 'out'));
  // Неразрывный пробел внутри числа: «129 900 сом» не должно переноситься по строкам.
  const text = m.t.replace(/(\d) (?=\d{3})/g, '$1 ');
  const photo = m.img ? '<div class="photo">' + m.img + '</div>' : '';
  const b = el('bubble' + (m.img ? ' has-photo' : ''),
    photo + esc(text) + '<span class="time">' + clock() + (m.s === 'out' ? ' ✓✓' : '') + '</span>');
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  AUDIO.sfx(m.s === 'in' ? 'in' : 'out');
}

function typing(side, on) {
  const old = chat.querySelector('.row.typing-row');
  if (old) old.remove();
  if (!on) return;
  const row = el('row ' + side + ' typing-row');
  row.appendChild(el('bubble typing', '<i></i><i></i><i></i>'));
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

// Карточка уходит либо по своему таймеру, либо вместе со сменой сцены — что
// раньше. Иначе уведомление из прошлой сцены ещё секунду висит поверх новой.
function hideCards() {
  cards.querySelectorAll('.card:not(.hide)').forEach((c) => {
    c.classList.add('hide');
    setTimeout(() => c.remove(), 350);
  });
}

function showCard(text, dur) {
  const c = el('card');
  c.innerHTML = '<div class="src">✈️ Telegram · вам</div><div class="txt">' + esc(text) + '</div>';
  cards.appendChild(c);
  AUDIO.sfx('card');
  setTimeout(hideCards, dur * 1000);
}

function openScene(sc) {
  hideCards();
  chat.innerHTML = '';
  phone.className = 'phone ' + (sc.app === 'tg' ? 'tg ' : '') + 'show';
  head.innerHTML =
    '<div class="ava">' + sc.ava + '</div>' +
    '<div><div class="who">' + sc.who + '</div><div class="st">' + sc.st + '</div></div>';
  tagEl.textContent = sc.tag;
  tagEl.classList.add('show');
  capEl.innerHTML = sc.cap;
  capEl.classList.add('show');
  over.classList.remove('show');
  AUDIO.sfx('scene');
}

function showOverlay(sc) {
  hideCards();
  const parts = ['<div class="wa-mark">' + sc.mark + '</div>', '<h1>' + sc.h1 + '</h1>'];
  if (sc.sub) parts.push('<div class="sub">' + sc.sub.replace(/\n/g, '<br>') + '</div>');
  if (sc.niches) parts.push('<div class="niches">' + sc.niches + '</div>');
  over.innerHTML = '<div class="fadein">' + parts.join('') + '</div>';
  over.classList.add('show');
  phone.classList.remove('show');
  tagEl.classList.remove('show');
  capEl.classList.remove('show');
  AUDIO.sfx('scene');
}

/* ---------------- раскладка по времени ----------------
   Сколько «весит» сообщение: длинное читают дольше, печать занимает своё.
   Веса относительные — движок растягивает или сжимает их так, чтобы сцена
   уложилась ровно между фразами озвучки. */
const readW = (t) => Math.min(1700, 550 + t.length * 20);
const weight = (m) => (m.typing || 0) + readW(m.t) + (m.img ? 700 : 0);

const LEAD = 0.34;   // пауза после появления телефона до первого сообщения
const TAIL = 0.22;   // хвост, чтобы последнее сообщение не сменялось встык

// Возвращает список событий {t, fn}, отсортированный по времени.
function buildTimeline() {
  const ev = [];
  const add = (t, fn) => ev.push({ t, fn });

  SCENES.forEach((sc, i) => {
    const t1 = i + 1 < SCENES.length ? SCENES[i + 1].at : CONFIG.end;

    if (sc.type !== 'chat') {
      add(sc.at, () => showOverlay(sc));
      // Призыв появляется отдельно и позже остального финала — ровно под словами
      // «Напишите мне», иначе он проходит мимо ушей.
      if (sc.pill && sc.pillAt) {
        add(sc.pillAt, () => {
          if (over.firstChild) over.firstChild.appendChild(el('pill', sc.pill));
        });
      }
      return;
    }

    add(sc.at, () => openScene(sc));
    if (sc.card) add(sc.card.at, () => showCard(sc.card.t, sc.card.dur));

    // Раскладываем сообщения по окну сцены пропорционально весам.
    // Если в сцене есть уведомление владельцу — переписка обязана закончиться
    // до него: карточка это точка сцены, и она не должна спорить с новым
    // сообщением, которое выезжает у неё под носом.
    let cur = sc.at + LEAD;
    const stop = sc.card ? Math.min(sc.card.at - 0.15, t1 - TAIL) : t1 - TAIL;
    const sum = sc.msgs.reduce((s, m) => s + weight(m), 0) || 1;
    const k = Math.max(0, stop - cur) / sum;
    for (const m of sc.msgs) {
      const span = weight(m) * k;
      const side = m.s === 'in' ? 'in' : 'out';
      if (m.typing) {
        // Печать занимает свою долю внутри выделенного сообщению отрезка.
        const share = (m.typing / weight(m)) * span;
        const start = cur;
        add(start, () => typing(side, true));
        add(start + share, () => { typing(side, false); addMsg(m); });
      } else {
        add(cur, () => addMsg(m));
      }
      cur += span;
    }
  });

  // Музыка выходит вперёд, когда голос отговорил.
  add(36.4, () => AUDIO.swell(true));

  return ev.sort((a, b) => a.t - b.t);
}

/* ---------------- проигрывание ----------------
   Часы — время озвучки. Если голос выключен или уже кончился, считаем по
   performance.now(): иначе на хвосте ролика время замирает и цикл не начнётся. */
const TIMELINE = buildTimeline();
const voice = new Audio(CONFIG.voice);
voice.preload = 'auto';

let useVoice = false;
let cursor = 0;
let t0 = 0;               // момент старта круга, performance.now()
let running = false;
let onFinish = null;      // сюда цепляется остановка записи

function now() {
  const wall = (performance.now() - t0) / 1000;
  // Подтягиваем часы к аудио, если оно ушло вперёд или отстало: небольшой
  // рассинхрон копится за 38 секунд и заметен на смене сцен.
  if (useVoice && !voice.paused && !voice.ended && voice.currentTime > 0.05) {
    const drift = wall - voice.currentTime;
    if (Math.abs(drift) > 0.12) t0 += drift * 1000;
    return voice.currentTime;
  }
  return wall;
}

function reset() {
  cursor = 0;
  chat.innerHTML = '';
  cards.innerHTML = '';
  over.classList.remove('show');
  over.innerHTML = '';
  phone.classList.remove('show');
  tagEl.classList.remove('show');
  capEl.classList.remove('show');
  AUDIO.swell(false);
}

function play() {
  reset();
  t0 = performance.now();
  if (useVoice) {
    try { voice.currentTime = 0; } catch (e) { /* ещё не догрузилось */ }
    voice.play().catch(() => {});
  }
  if (!running) { running = true; requestAnimationFrame(loop); }
}

function loop() {
  const t = now();
  while (cursor < TIMELINE.length && TIMELINE[cursor].t <= t) TIMELINE[cursor++].fn();
  if (t >= CONFIG.end) {
    if (onFinish) {
      const f = onFinish;
      onFinish = null;
      running = false;            // без этого play() потом не перезапустит цикл
      f();
      return;
    }
    play();                       // зациклено — удобно и смотреть, и записывать
  }
  requestAnimationFrame(loop);
}

/* ---------------- панель ---------------- */
const ui = document.getElementById('ui');
const musBtn = document.getElementById('mus');
document.getElementById('dur').textContent = 'длительность ' + CONFIG.end.toFixed(1) + ' сек';
document.getElementById('replay').onclick = play;
document.getElementById('hide').onclick = () => ui.classList.add('hidden');
musBtn.onclick = () => { AUDIO.toggleSound(); musBtn.classList.toggle('off', !AUDIO.isSoundOn()); };

addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') ui.classList.toggle('hidden');
  if (e.key === 'r' || e.key === 'R') play();
  if (e.key === 'm' || e.key === 'M') { AUDIO.toggleSound(); musBtn.classList.toggle('off', !AUDIO.isSoundOn()); }
});
if (new URLSearchParams(location.search).get('clean') === '1') ui.classList.add('hidden');

/* ---------------- запись в файл ----------------
   Браузер отдаёт картинку вкладки, мы вырезаем из неё только сцену 9:16 и
   пишем в файл. Отдельная программа для записи экрана не нужна, и в кадр
   не попадают ни панель управления, ни рамка браузера. */
const recBadge = document.getElementById('rec');
const recTxt = document.getElementById('recTxt');
const saveBtn = document.getElementById('save');

function pickMime() {
  return [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm',
  ].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
}

if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !pickMime()) {
  saveBtn.style.display = 'none';
}

async function record() {
  const mime = pickMime();
  let src;
  try {
    src = await navigator.mediaDevices.getDisplayMedia({
      // Верхнюю границу задаём заведомо большой: по умолчанию браузер режет
      // картинку вкладки до 1920x1080, и вертикальный кадр теряет в чёткости.
      // Больше, чем есть на самом деле, он всё равно не отдаст.
      video: { frameRate: 30, width: { max: 3840 }, height: { max: 3840 } },
      audio: true,                  // звук вкладки: голос и звуки переписки
      preferCurrentTab: true,
      selfBrowserSurface: 'include',
    });
  } catch (e) {
    return;                         // пользователь закрыл выбор окна
  }

  saveBtn.disabled = true;
  ui.classList.add('hidden');

  const vid = document.createElement('video');
  vid.srcObject = new MediaStream(src.getVideoTracks());
  vid.muted = true;
  await vid.play();

  const cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1920;
  const g = cv.getContext('2d');

  // Вырезаем из картинки вкладки прямоугольник сцены. Коэффициент — сколько
  // пикселей записи приходится на один CSS-пиксель страницы; по каждой оси
  // свой, потому что картинка вкладки не всегда совпадает с ней пропорциями.
  let stop = false;
  function draw() {
    if (stop) return;
    const r = stage.getBoundingClientRect();
    const kx = vid.videoWidth / window.innerWidth;
    const ky = vid.videoHeight / window.innerHeight;
    g.drawImage(vid, r.left * kx, r.top * ky, r.width * kx, r.height * ky, 0, 0, 1080, 1920);
    requestAnimationFrame(draw);
  }
  draw();

  const out = new MediaStream([
    ...cv.captureStream(30).getVideoTracks(),
    ...src.getAudioTracks(),
  ]);
  const rec = new MediaRecorder(out, { mimeType: mime, videoBitsPerSecond: 10e6 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stop = true;
    src.getTracks().forEach((t) => t.stop());
    reset();                      // чистим сцену только после остановки записи
    const blob = new Blob(chunks, { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'promo-whatsapp-bot.' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm');
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    recBadge.classList.remove('on');
    saveBtn.disabled = false;
    ui.classList.remove('hidden');
  };

  recBadge.classList.add('on');
  recTxt.textContent = 'Идёт запись · ' + Math.round(CONFIG.end) + ' сек';
  // Останавливаемся ровно на конце круга, а не по таймеру: круг может слегка
  // «плыть» вслед за аудио, и по таймеру хвост бы обрезался.
  onFinish = () => {
    voice.pause();
    rec.stop();
  };
  rec.start();
  play();
}
saveBtn.onclick = record;

/* --- старт по клику: без действия пользователя браузер не включит звук --- */
const gate = document.getElementById('gate');
function start(sound) {
  AUDIO.init(sound);
  useVoice = sound;
  gate.classList.add('gone');
  play();
}
document.getElementById('goSound').onclick = () => start(true);
document.getElementById('goMute').onclick = () => start(false);

document.getElementById('gateWarn').innerHTML =
  '<b>Как получить файл.</b> Кнопка «⬇ Сохранить видео» запишет ролик сама: ' +
  'браузер спросит, какую вкладку снимать — выберите текущую и обязательно ' +
  'включите «Поделиться звуком вкладки». Ролик проиграется один раз, файл ' +
  'скачается автоматически. Чем больше окно браузера, тем выше разрешение записи — ' +
  'разверните его на весь экран (F11).';
</script>
